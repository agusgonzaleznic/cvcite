# Weekly updates for the pinned actions in .github/workflows and action.yml, in one pull request.
# The workflows `init` writes live under src/ where Dependabot does not look; lint.yml fails when
# their pins differ from these, so a bump of an action they share is finished in the same pull
# request. A bump that reaches action.yml or src/ ships, so that pull request also raises the
# version in src/cvcite/__init__.py and the plugin's two copies, and "Release / Check the version"
# fails until it does. The Python locks in requirements/ are regenerated by hand (see their
# headers); Dependabot alerts still cover every package in them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # A new release waits a week before Dependabot proposes it.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
